name: Manual verification

on:
  workflow_dispatch:
    inputs:
      upload_reports:
        description: Upload detailed reports (uses artifact storage quota)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: manual-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Policy, JVM tests, lint, and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Check verification helpers and release signing gate
        shell: bash
        run: |
          python3 scripts/test_verify.py
          python3 scripts/test_ci_report_summary.py
          python3 -B scripts/test_release_licenses.py
          hermes_git_common_dir="$(git rev-parse --path-format=absolute --git-common-dir)"
          flock --exclusive "$hermes_git_common_dir/hermes-mobile-gradle.lock" python3 scripts/test_release_signing.py

      - name: Run repository verification
        id: verification
        shell: bash
        run: |
          hermes_git_common_dir="$(git rev-parse --path-format=absolute --git-common-dir)"
          flock --exclusive "$hermes_git_common_dir/hermes-mobile-gradle.lock" ./scripts/verify.sh

      - name: Verify release dependency notices and packaged assets
        shell: bash
        run: |
          hermes_git_common_dir="$(git rev-parse --path-format=absolute --git-common-dir)"
          flock --exclusive "$hermes_git_common_dir/hermes-mobile-gradle.lock" ./gradlew --no-configuration-cache -I scripts/license-inputs.init.gradle :app:exportReleaseLicenseInputs
          python3 scripts/check_release_licenses.py --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Preserve test and lint reports
        id: reports
        if: ${{ always() && !cancelled() && inputs.upload_reports }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

      - name: Summarize verification evidence
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          VERIFIER_OUTCOME: ${{ steps.verification.outcome }}
          UPLOAD_OUTCOME: ${{ steps.reports.outcome }}
        run: python3 scripts/ci_report_summary.py
